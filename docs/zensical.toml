[project]
site_url = "https://docs.speedtest-tracker.dev/"
site_name = "Speedtest Tracker"
site_description = "A self-hosted application that monitors the performance and uptime of your internet connection."

docs_dir = "content"
site_dir = "site"

repo_url = "https://github.com/alexjustesen/speedtest-tracker"
repo_name = "alexjustesen/speedtest-tracker"
edit_uri = "edit/main/docs/content/"

nav = [
  { "Home" = [
    { "Home" = "index.md" },
    { "Features" = "features.md" },
    { "Releases Notes" = "releases.md" },
  ] },
  { "Installation" = [
    { "Installation" = [
      "installation/installation/index.md",
      { "Docker" = "installation/installation/docker.md" },
      { "Kubernetes" = "installation/installation/kubernetes.md" },
      { "QNAP" = "installation/installation/qnap.md" },
      { "Synology" = "installation/installation/synology.md" },
      { "Unraid" = "installation/installation/unraid.md" },
    ] },
    { "Configuration" = [
      { "Environment Variables" = "installation/environment-variables.md" },
    ] },
    { "Database Drivers" = "installation/database-drivers.md" },
  ] },
  { "Help" = [
    "help/index.md",
    { "Error Messages" = "help/error-messages.md" },
    { "Frequently Asked Questions" = "help/faqs.md" },
  ] },
  { "Security" = [
    { "Authentication" = "security/authentication.md" },
    { "Authorization" = "security/authorization.md" },
    { "Encryption" = "security/encryption.md" },
  ] },
  { "Settings" = [
    { "Data Integrations" = [
      "settings/data-platforms/index.md",
      { "InfluxDB v2" = "settings/data-platforms/influxdb2.md" },
      { "Prometheus" = "settings/data-platforms/prometheus.md" },
    ] },
    { "Notifications" = [
      "settings/notifications/index.md",
      { "Apprise" = "settings/notifications/apprise.md" },
      { "Database" = "settings/notifications/database.md" },
      { "Mail" = "settings/notifications/mail.md" },
      { "Webhook" = "settings/notifications/webhook.md" },
    ] },
  ] },
  { "Other" = [
    { "Speedtest Process" = "other/speedtest-process.md" },
    { "Proxies" = [
      "other/proxies/index.md",
      { "Cloudflare Tunnel (Zero Trust)" = "other/proxies/cloudflare-tunnel-zero-trust.md" },
      { "Traefik" = "other/proxies/traefik.md" },
      { "Tailscale" = "other/proxies/tailscale.md" },
      { "Nginx" = "other/proxies/nginx.md" },
    ] },
    { "Commands" = "other/commands.md" },
    { "Data Dictionary" = "other/data-dictionary.md" },
    { "Embed Dashboard" = "other/embed-dashboard.md" },
    { "Health Check" = "other/health-check.md" },
    { "Community Projects" = "other/community-projects.md" },
  ] },
  { "API" = [
    { "Authorization" = "api/authorization.md" },
    { "API Reference" = "api/responses/index.md" },
  ] },
  { "Contributing" = [
    { "Development Environment" = "contributing/development-environment.md" },
  ] },
  { "More" = [
    { "Source Code" = "https://github.com/alexjustesen/speedtest-tracker" },
    { "Releases" = "https://github.com/alexjustesen/speedtest-tracker/releases" },
    { "About Me" = "https://alexjustesen.com/?utm_campaign=oss-projects&utm_source=speedtest-tracker-docs&utm_medium=textlink" },
    { "Donate" = "https://github.com/sponsors/alexjustesen" },
  ] },
]

extra_css = [
  "https://cdn.jsdelivr.net/npm/swagger-ui-dist@5/swagger-ui.css",
  "stylesheets/extra.css",
]
extra_javascript = [
  "https://cdn.jsdelivr.net/npm/swagger-ui-dist@5/swagger-ui-bundle.js",
  "javascripts/swagger-ui.js",
]

[project.theme]
# variant = "classic"
# custom_dir = "overrides"
# favicon = "images/favicon.png"
language = "en"
features = [
  "announce.dismiss",
  "content.action.edit",
  "content.action.view",
  "content.code.annotate",
  "content.code.copy",
  "content.code.select",
  "content.footnote.tooltips",
  "content.tabs.link",
  "content.tooltips",
  # "header.autohide",
  # "navigation.expand",
  "navigation.footer",
  "navigation.indexes",
  "navigation.instant",
  "navigation.instant.prefetch",
  # "navigation.instant.progress",
  "navigation.path",
  # "navigation.prune",
  "navigation.sections",
  "navigation.tabs",
  "navigation.tabs.sticky",
  "navigation.top",
  "navigation.tracking",
  "search.highlight",
  # "toc.follow",
  # "toc.integrate",
]

# logo = "assets/logo.png"

# [project.theme.icon]
# logo = "lucide/smile"

# [project.theme.font]
# text = "Inter"
# code = "Jetbrains Mono"

[[project.theme.palette]]
media = "(prefers-color-scheme)"
toggle.icon = "lucide/sun-moon"
toggle.name = "Switch to light mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
toggle.icon = "lucide/moon"
toggle.name = "Switch to system preference"

[[project.extra.social]]
icon = "fontawesome/brands/github"
link = "https://github.com/alexjustesen/speedtest-tracker"

# [[project.extra.social]]
# icon = "fontawesome/brands/mastodon"
# link = "https://fosstodon.org/@user"

[project.markdown_extensions]
abbr = {}
admonition = {}
attr_list = {}
def_list = {}
footnotes = {}
md_in_html = {}
toc.permalink = true
pymdownx.arithmatex.generic = true
pymdownx.betterem = {}
pymdownx.caret = {}
pymdownx.details = {}
pymdownx.emoji.emoji_generator = "zensical.extensions.emoji.to_svg"
pymdownx.emoji.emoji_index = "zensical.extensions.emoji.twemoji"
pymdownx.highlight.anchor_linenums = true
pymdownx.highlight.line_spans = "__span"
pymdownx.highlight.pygments_lang_class = true
pymdownx.inlinehilite = {}
pymdownx.keys = {}
pymdownx.magiclink = {}
pymdownx.mark = {}
pymdownx.smartsymbols = {}
pymdownx.snippets.base_path = ["includes"]
pymdownx.snippets.auto_append = ["abbreviations.md"]
pymdownx.superfences.custom_fences = [
  { name = "mermaid", class = "mermaid", format = "pymdownx.superfences.fence_code_format" },
]
pymdownx.tabbed.alternate_style = true
pymdownx.tabbed.combine_header_slug = true
pymdownx.tasklist.custom_checkbox = true
pymdownx.tilde = {}
